<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<h1>GeeksforGeeks Survey Form</h1>
<form>
  <label>Name</label><br>
 <input type="text" placeholder="Enter your name"><br>

  <label>Email</label><br>
  <input type="email" placeholder="Enter your email"><br>

  <label>Age</label><br>
  <input type="number" placeholder="Enter your age"><br>

  <label>Which option best describes you?</label><br>
  <select>
    <option>Student</option>
    <option>Worker</option>
    <option>Teacher</option>
  </select><br>

  <p>Would you recommend GeeksforGeeks to a friend?</p>
  <input type="radio" name="rec"> Yes<br>
  <input type="radio" name="rec"> No<br>
  <input type="radio" name="rec"> Maybe<br><br>

  <p>Languages and Frameworks known (Check all that apply)</p>
  <input type="checkbox"> C<br>
  <input type="checkbox"> C++<br>
  <input type="checkbox"> C#<br>
  <input type="checkbox"> Java<br>
  <input type="checkbox"> Python<br>
  <input type="checkbox"> JavaScript<br>
  <input type="checkbox"> React<br>
  <input type="checkbox"> Angular<br>
  <input type="checkbox"> Django<br>
  <input type="checkbox"> Spring<br><br>

  <label>Any comments or suggestions</label><br>
  <textarea rows="3"></textarea><br><br>

  <button>Submit</button>
</form>

</body>
</html>
